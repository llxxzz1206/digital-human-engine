[project]
name = "python-ai-engine"
version = "0.1.0"
description = "Digital Human Studio - Python AI Engine (FastAPI + LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    # LLM (OpenAI SDK 兼容，适用于千问/GPT/DeepSeek等)
    "openai>=1.0.0",
    # LangGraph 工作流编排
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # ASR 本地语音识别
    "openai-whisper>=20240930",
    # TTS 讯飞 WebSocket API（已内置 websockets，无需额外依赖）
    # RAG 向量检索
    "pymilvus>=2.5.0",
    # Redis 缓存
    "redis[hiredis]>=5.0.0",
    # PostgreSQL (TTS 音频缓存)
    "asyncpg>=0.30.0",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP
    "httpx>=0.28.0",
    "gmssl>=3.2.2",
    # 中文拼音（Avatar 口型提示）
    "pypinyin>=0.51.0",
    # 文档解析（知识库构建）
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    # 噪音抑制（展馆嘈杂环境）
    "noisereduce>=3.0.0",
    "webrtcvad>=2.0.10",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
